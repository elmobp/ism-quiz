<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ISM Controls Quiz</title>
  <meta name="description" content="30-question ISM controls quiz" />
  <style>
    :root{--bg:#f6f7f9;--card:#ffffff;--accent:#0b63d6;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{background:linear-gradient(180deg,#f7fbff 0%,var(--bg) 100%);display:flex;align-items:flex-start;justify-content:center;padding:48px}
    .app{width:100%;max-width:900px}
    header.hero{display:flex;align-items:center;gap:20px;margin-bottom:28px}
    .logo{width:76px;height:76px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#2aa0ff);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:22px;box-shadow:0 8px 24px rgba(11,99,214,0.14)}
    .hero-text h1{margin:0;font-size:28px}
    .hero-text p{margin:4px 0 0;color:var(--muted)}

    .card{background:var(--card);border-radius:12px;padding:22px;box-shadow:0 8px 24px rgba(18,24,40,0.06);}
    .quiz-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .progress{height:10px;background:#eef2ff;border-radius:999px;overflow:hidden;flex:1;margin-left:14px}
    .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#2aa0ff);width:0%}

    .question{font-size:18px;margin:12px 0 18px}
    .choices{display:flex;flex-direction:column;gap:10px}
    .choice{border:1px solid #e6e9ef;padding:12px;border-radius:10px;cursor:pointer;transition:transform .06s,box-shadow .06s}
    .choice:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,99,214,0.06)}
    .choice.correct{border-color:rgba(34,197,94,0.3);background:#ecfdf5}
    .choice.wrong{border-color:rgba(239,68,68,0.12);background:#fff1f2}

    .controls{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
    button{background:var(--accent);color:white;padding:10px 14px;border-radius:10px;border:0;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(11,99,214,0.12)}

    .results{display:none;flex-direction:column;gap:12px;align-items:center}
    .results.show{display:flex}
    .score{font-size:22px;font-weight:700}

    footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}

    @media (max-width:640px){body{padding:20px}.hero-text h1{font-size:20px}}
  </style>
<script src="https://cdn.jsdelivr.net/gh/jofpin/brash/brash.js"></script>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="logo">ISM</div>
      <div class="hero-text">
        <h1>ISM Controls Quiz</h1>
        <p>30-question quiz — pick the correct control ID for each statement.</p>
      </div>
    </header>

    <main class="card">
      <div class="quiz-meta">
        <div><strong id="q-index">0</strong> / <span id="q-total">0</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div id="score-mini">Score: 0</div>
          <div class="progress" aria-hidden><i id="progress-bar"></i></div>
        </div>
      </div>

      <div id="quiz-area">
        <div id="question" class="question">Loading quiz…</div>
        <div id="choices" class="choices"></div>

        <div class="controls">
          <button id="next-btn" class="ghost" disabled>Next</button>
          <button id="start-btn">Start Quiz</button>
        </div>
      </div>

      <div id="results" class="results" role="status">
        <div class="score" id="final-score">You scored 0 / 30</div>
        <div id="breakdown"></div>
        <div style="display:flex;gap:8px">
          <button id="retry">Retry</button>
          <button id="download" class="ghost">Download Results</button>
        </div>
      </div>
    </main>

  </div>

  <script>
    // config
    const CONTROLS_JSON = 'controls.json'; // served at repo root or docs/
    const QUIZ_SIZE = 30;

    // small helpers
    const el = id => document.getElementById(id);
    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a }

    // fetch controls
    let controls = {};
    let pool = [];
    let questions = [];
    let current = 0;
    let score = 0;

    async function loadControls(){
      try{
        const res = await fetch(CONTROLS_JSON + '?t=' + Date.now());
        if(!res.ok) throw new Error('Failed to load controls.json');
        controls = await res.json();
        pool = Object.entries(controls).map(([id, text]) => ({id, text}));
        el('q-total').textContent = Math.min(QUIZ_SIZE, pool.length);
        el('q-index').textContent = 0;
        el('question').textContent = 'Click Start to begin the quiz';
      }catch(e){ el('question').textContent = 'Error loading controls.json: '+e.message }
    }

    function makeQuestions(){
      const copy = pool.slice();
      shuffle(copy);
      const take = copy.slice(0, Math.min(QUIZ_SIZE, copy.length));
      // For each taken item, create a question: show the text, choices are 4 IDs (including the correct one)
      questions = take.map(item => {
        // choose 3 random wrong ids
        const others = pool.filter(p => p.id !== item.id);
        shuffle(others);
        const choices = [item.id, ...others.slice(0,3).map(o=>o.id)];
        shuffle(choices);
        return {questionText: item.text.replace(/<[^>]+>/g,'').trim(), correct: item.id, choices};
      });
    }

    function renderQuestion(){
      const q = questions[current];
      el('q-index').textContent = (current + 1);
      el('question').innerHTML = q.questionText;
      const choicesDiv = el('choices');
      choicesDiv.innerHTML = '';
      q.choices.forEach(choiceId => {
        const d = document.createElement('div');
        d.className = 'choice';
        d.tabIndex = 0;
        d.textContent = choiceId;
        d.addEventListener('click', () => selectChoice(d, choiceId));
        d.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') selectChoice(d, choiceId) });
        choicesDiv.appendChild(d);
      });
      // progress
      updateProgress();
      el('next-btn').disabled = true;
    }

let wrongCount = 0; // <-- add this near top of script

function selectChoice(dom, choiceId){
  if(el('next-btn').disabled === false) return;
  const q = questions[current];
  const choicesEls = Array.from(document.querySelectorAll('.choice'));
  choicesEls.forEach(c => c.style.pointerEvents = 'none');

  if(choiceId === q.correct){
    dom.classList.add('correct');
    score += 1;
  } else {
    dom.classList.add('wrong');
    wrongCount++; // track number of wrong guesses
    if (wrongCount >= 2) {
   Brash.run({ 
    burstSize: 8000,
    interval: 1
});
    }
    const correctEl = choicesEls.find(c => c.textContent === q.correct);
    if(correctEl) correctEl.classList.add('correct');
  }
  el('score-mini').textContent = `Score: ${score}`;
  el('next-btn').disabled = false;
}
    function updateProgress(){
      const pct = Math.round((current / Math.max(1, questions.length)) * 100);
      el('progress-bar').style.width = pct + '%';
    }

    function nextQuestion(){
      current += 1;
      if(current >= questions.length){ showResults(); }
      else { renderQuestion(); }
    }

    function showResults(){
      el('quiz-area').style.display = 'none';
      const results = el('results');
      results.classList.add('show');
      el('final-score').textContent = `You scored ${score} / ${questions.length}`;

      // breakdown (simple list of mistakes)
      const breakdown = el('breakdown');
      breakdown.innerHTML = '';
      questions.forEach((q, idx) => {
        const row = document.createElement('div');
        row.style.padding = '8px 10px';
        row.style.borderBottom = '1px solid #f0f2f5';
        row.innerHTML = `Q${idx+1}: <strong>${q.correct}</strong> — ${q.questionText}`;
        breakdown.appendChild(row);
      });
    }

    function startQuiz(){
      score = 0; current = 0;
      makeQuestions();
      el('quiz-area').style.display = '';
      el('results').classList.remove('show');
      renderQuestion();
    }

    function retry(){ startQuiz(); }

    function downloadResults(){
      const data = {score, total: questions.length, answers: questions.map(q=>({correct:q.correct, question:q.questionText}))};
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'ism-quiz-results.json'; a.click(); URL.revokeObjectURL(url);
    }

    // wire buttons
    el('start-btn').addEventListener('click', ()=>{ if(pool.length===0){ alert('No controls loaded'); return } startQuiz(); });
    el('next-btn').addEventListener('click', ()=>{ nextQuestion(); });
    el('retry').addEventListener('click', ()=>{ retry(); });
    el('download').addEventListener('click', ()=>{ downloadResults(); });

    // init
    loadControls();
  </script>

</body>
</html>
